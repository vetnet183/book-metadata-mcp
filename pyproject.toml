[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-metadata-mcp"
version = "0.1.2"
description = "MCP server for book metadata lookup — searches Google Books and Open Library with intelligent scoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Colony Library", email = "colonylibrary@users.noreply.github.com" },
]
keywords = ["mcp", "books", "metadata", "google-books", "open-library", "covers", "isbn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
covers = ["Pillow>=9.0.0"]
dev = ["pytest", "Pillow>=9.0.0"]

[project.scripts]
book-metadata-mcp = "book_metadata_mcp.server:main"

[project.urls]
Homepage = "https://github.com/colonylibrary/book-metadata-mcp"
Repository = "https://github.com/colonylibrary/book-metadata-mcp"
Issues = "https://github.com/colonylibrary/book-metadata-mcp/issues"
